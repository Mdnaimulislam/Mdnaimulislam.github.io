<!doctype html><html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Source Serif 4';src:url('/fonts/source-serif-4-latin-wght-normal.woff2') format('woff2-variations');font-weight:200 900;}
  @font-face{font-family:'Inter';src:url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');font-weight:100 900;}
  @font-face{font-family:'IBM Plex Mono';src:url('/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400;}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#fcfbf9;font-family:Inter,sans-serif;
       display:flex;align-items:center;gap:56px;padding:78px 80px;color:#16191d;position:relative}
  body::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:#1c4e80}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.11em;text-transform:uppercase;color:#1c4e80;margin-bottom:26px}
  h1{font-family:'Source Serif 4',serif;font-size:74px;line-height:1.03;letter-spacing:-.024em;font-weight:700;max-width:15ch}
  .aff{font-size:27px;color:#4a5058;margin-top:26px}
  .tags{display:flex;gap:11px;margin-top:36px;flex-wrap:wrap;max-width:660px}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:16px;color:#4a5058;border:1px solid #d2cec6;
       background:#f4f2ee;border-radius:99px;padding:6px 15px}
  img{width:260px;height:260px;border-radius:16px;object-fit:cover;border:1px solid #e6e3dd;flex:none}
</style></head><body>
<div>
  <p class="kicker">AI Research Engineer</p>
  <h1>Mohammod Naimul Islam Suvon</h1>
  <p class="aff">Centre for Machine Intelligence, University of Sheffield</p>
  <div class="tags">
    <span class="tag">Multimodal learning</span><span class="tag">Medical imaging</span>
    <span class="tag">Cardiovascular AI</span><span class="tag">Low-cost clinical AI</span>
  </div>
</div>
<img src="/img/portrait.jpg" alt="">
</body></html>
